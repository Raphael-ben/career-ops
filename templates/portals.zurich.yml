tracked_companies:
  - name: TEMPLATE — Recruitee company
    careers_url: https://<slug>.recruitee.com
    api_provider: recruitee
    enabled: false
    notes: Template. Replace <slug> with the real Recruitee tenant, then enable.
  - name: TEMPLATE — Workable company
    careers_url: https://apply.workable.com/<slug>
    api_provider: workable
    enabled: false
    notes: Template. Replace <slug> with the real Workable account, then enable.
  - name: TEMPLATE — SolidJobs division
    careers_url: https://solid.jobs/public-api/offers/other
    api_provider: solidjobs
    enabled: false
    notes: Template. Pick the relevant division (sales/finances/other), then enable.
  - name: McKinsey Zurich
    careers_url: https://www.mckinsey.com/careers/search-jobs
    scan_method: websearch
    scan_query: '"mckinsey" "strategy" OR "associate" Zurich Switzerland site:mckinsey.com/careers'
    enabled: false
    notes: 'DISABLED: consulting roles excluded.'
