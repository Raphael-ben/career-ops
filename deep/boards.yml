# deep/boards.yml — what deep/run_deep.py harvests. Fork-owned, edit freely.
# Recovered 2026-11-07 from the 2026-11-06 scan session's scratch scripts
# (harvest.py / harvest_ats.py / harvest_wd2.py), de-duplicated.
#
# Search terms are NOT kept here: run_deep.py builds the LinkedIn / jobs.ch queries and the
# Workday keywords from YOUR config/profile.yml at runtime:
#   scan.deep_queries / scan.deep_workday_keywords  (optional explicit lists), else
#   target_roles.primary + target_roles.archetypes[].name.
# No roles in the profile -> the deep layer prints one warning and is skipped.

linkedin:
  location: "Zürich, Switzerland"
  distance_km: 50
  detail_max: 30        # postings whose detail page is fetched for the applicant count

jobsch:
  location: "Zürich"
  max_pages: 2          # 20 rows per page, newest first

# Workday CXS tenants: "tenant|wdN|site". Searched with the tenant's own
# Switzerland location facet when it has one, else filtered by location text.
workday:
  - abb|wd3|external_career_page
  - alcon|wd5|careers_alcon
  - galderma|wd3|external
  - gategroup|wd3|gategroup_external_careers
  - georgfischer|wd103|georgfischer_careers
  - hitachi|wd1|hitachi
  - juliusbaer|wd3|external
  - kardex|wd103|kardex
  - lgt|wd3|lgtcurrentvacancies
  - lgtcp|wd502|lgtcpcurrentvacancies
  - lonza|wd3|lonza_careers
  - medela|wd103|medela_careers
  - novartis|wd3|novartis_careers
  - roche|wd3|roche-ext
