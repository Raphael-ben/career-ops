<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workday Filler</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px; margin: 0; padding: 12px;
      background: #fafafa; color: #1a1a1a;
    }
    label { display: block; font-weight: 600; font-size: 12px; margin: 8px 0 3px; color: #333; }
    #pkg { color: #333; margin-top: 8px; font-weight: 600; }
    #warn { color: #c0392b; margin-top: 8px; font-size: 12px; }
    .item {
      background: white; border: 1px solid #e0e0e0;
      border-radius: 6px; padding: 8px; margin-top: 8px; font-size: 12px;
    }
    .hint { color: #666; font-size: 11px; margin-top: 2px; word-break: break-word; }
    button {
      padding: 3px 10px; border-radius: 4px;
      border: 1px solid #ccc; cursor: pointer;
      font-size: 12px; background: white;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.primary { background: #1a73e8; color: white; border-color: #1a73e8; width: 100%; padding: 8px; margin-top: 12px; }
    button.primary:hover:not(:disabled) { background: #1557b0; }
  </style>
</head>
<body>
  <label for="folder">Application folder</label>
  <input type="file" id="folder" webkitdirectory>
  <label for="pick">Or pick files (apply.json + PDFs)</label>
  <input type="file" id="pick" multiple accept=".json,.pdf">
  <div id="pkg"></div>
  <div id="warn"></div>
  <button id="fill" class="primary" disabled>Fill this step</button>
  <div id="report"></div>
  <button id="copyClaude" class="primary" hidden>Copy for Claude</button>
  <script src="ats/workday.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
