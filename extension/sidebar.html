<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claude Apply</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px; margin: 0; padding: 12px;
      background: #fafafa; color: #1a1a1a;
    }
    #status { color: #555; margin-bottom: 10px; font-style: italic; }
    #fields { display: flex; flex-direction: column; gap: 8px; }
    .field-row {
      background: white; border: 1px solid #e0e0e0;
      border-radius: 6px; padding: 8px;
    }
    .field-label { font-weight: 600; font-size: 12px; margin-bottom: 4px; color: #333; }
    .field-answer {
      width: 100%; padding: 4px 6px; font-size: 12px;
      border: 1px solid #ccc; border-radius: 4px;
      resize: vertical; font-family: inherit;
    }
    .field-note { color: #c0392b; font-size: 11px; margin-top: 3px; }
    .field-hint { color: #666; font-size: 11px; margin-top: 2px; word-break: break-all; }
    .field-actions { margin-top: 6px; }
    button {
      padding: 3px 10px; border-radius: 4px;
      border: 1px solid #ccc; cursor: pointer;
      font-size: 12px; background: white;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.primary { background: #1a73e8; color: white; border-color: #1a73e8; }
    button.primary:hover:not(:disabled) { background: #1557b0; }
    #fill-all-wrap { margin-top: 12px; }
    #fill-all { width: 100%; padding: 8px; }
    #error { color: #c0392b; margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="status">Initialising…</div>
  <div id="fields"></div>
  <div id="fill-all-wrap" style="display:none">
    <button id="fill-all" class="primary">Fill All</button>
  </div>
  <div id="error"></div>
  <script src="sidebar.js"></script>
</body>
</html>
